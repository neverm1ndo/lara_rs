# Safe, non-secret defaults committed with the application.
# Environment variables and LARA_CONFIG_FILE overlays have higher priority.

[server]
bind_address = "127.0.0.1:3000"

[jwt]
issuer = "lara"
audience = "lara-api"
ttl_seconds = 3600

[mongodb]
database = "lara"

# Root of the managed SAMP/open.mp installation. Relative paths are resolved
# from the server process working directory. Production deployments should
# override this with an absolute path.
[game_server.storage]
root = "./game-server"
max_tree_depth = 32
max_tree_entries = 10000
max_stream_size_bytes = 10485760

[configuration.files]
configurator_directory = "scriptfiles/config"
binary_extensions = [
    "amx",
    "dff",
    "dll",
    "exe",
    "so",
    "txd",
]
binary_file_names = ["omp-server", "samp03svr"]
# Relative paths whose complete subtrees are omitted from listings and cannot
# be accessed through the configuration context.
ignored_paths = []
fallback_encoding = "windows-1251"

# Root of the recursive map tree, relative to game_server.storage.root.
[maps.files]
directory = "scriptfiles/maps"

# Multipart batch-upload limits. Map contents are treated as opaque bytes and
# are never decoded or parsed as XML by the backend.
[maps.upload]
max_files_per_request = 50
max_file_size_bytes = 10485760
max_total_size_bytes = 52428800

# Private storage for immutable full-file snapshots and DiffMatchPatch
# sidecars. This path is resolved from the process working directory and must
# not be located inside game_server.storage.root.
[backups.storage]
directory = "./data/backups"
compression = "gzip"
compression_level = 1
compression_threshold_bytes = 1048576

[backups.retention]
lifetime_seconds = 1209600 # 14 days
cleanup_interval_seconds = 3600
cleanup_batch_size = 50
max_concurrent_deletions = 8
operation_lease_seconds = 300
stale_preparation_seconds = 1800

# Diff artifacts are derived metadata. Full snapshots are still created when
# diff generation is disabled, unsupported for binary content, or fails.
[backups.diff]
enabled = true
max_input_size_bytes = 10485760
generation_timeout_ms = 5000

# Secrets and credential-bearing connection strings intentionally do not have
# file defaults. Supply them through:
#   LARA_JWT__SECRET
#   LARA_MYSQL__URL
#   LARA_MONGODB__URI
