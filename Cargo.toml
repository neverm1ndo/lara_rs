[package]
name = "lara-rs"
version = "0.2.2"
edition = "2024"
authors = ["neverm1ndo <it@nmnd.ru>"]
license = "MIT"
description = "Liberty Admin Realtime Analytics"

[package.metadata.deb]
maintainer = "neverm1ndo <it@nmnd.ru>"
copyright = "2026 neverm1ndo"
license-file = ["LICENSE.md", "4"]
extended-description = """\
Lara is the authenticated control plane for open.mp game servers. \
This package installs the API daemon, systemd units, configuration examples, \
and the Release A pilot verification utility.\
"""
section = "admin"
priority = "optional"
depends = "$auto, adduser, systemd"
maintainer-scripts = "debian"
changelog = "debian/changelog"
assets = [
    ["target/release/lara-rs", "usr/bin/", "755"],
    ["config/default.toml", "usr/share/lara-rs/config/default.toml", "644"],
    [".env.example", "usr/share/doc/lara-rs/examples/lara.env.example", "644"],
    ["deploy/systemd/instance.env.example", "usr/share/doc/lara-rs/examples/game-instance.env.example", "644"],
    ["deploy/systemd/override.conf.example", "usr/share/doc/lara-rs/examples/game-instance.override.conf.example", "644"],
    ["deploy/systemd/production.toml.example", "usr/share/doc/lara-rs/examples/production.toml.example", "644"],
    ["deploy/systemd/README.md", "usr/share/doc/lara-rs/systemd-pilot.md", "644"],
    ["deploy/systemd/verify-pilot.sh", "usr/lib/lara-rs/verify-pilot", "755"],
    ["deploy/systemd/lara-game@.service", "usr/lib/systemd/system/lara-game@.service", "644"],
]
systemd-units = [
    { unit-name = "lara-rs", unit-scripts = "deploy/systemd", enable = false, start = false },
]

[dependencies]
aes-gcm = "0.10.3"
argon2 = { version = "0.5.3", features = ["std"] }
async-compression = { version = "0.4.50", features = ["gzip", "tokio"] }
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
chrono = "0.4.45"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
dotenvy = "0.15.7"
diff-match-patch-rs = "0.5.1"
encoding_rs = "0.8.42"
futures-util = "0.3.31"
glob = "0.3.4"
hmac = "0.12.1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
md-5 = "0.11.0"
mongodb = "3.9.1"
multer = "3.1.0"
pest = "2.9.3"
pest_derive = "2.9.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
sea-orm = { version = "2.0.4", features = ["sqlx-mysql", "runtime-tokio-rustls"] }
serde = "1.0.229"
serde_json = "1.0.152"
sha1 = "0.10.6"
sha2 = "0.10.9"
similar = "3.2.0"
socketioxide = "0.18.7"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["signal", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = "0.7.1"
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = "1.9.1"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
