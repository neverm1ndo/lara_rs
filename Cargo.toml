[package]
name = "lara-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-compression = { version = "0.4.50", features = ["gzip", "tokio"] }
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
dotenvy = "0.15.7"
diff-match-patch-rs = "0.5.1"
encoding_rs = "0.8.42"
glob = "0.3.4"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
md-5 = "0.11.0"
mongodb = "3.9.1"
multer = "3.1.0"
pest = "2.9.3"
pest_derive = "2.9.3"
sea-orm = { version = "2.0.4", features = ["sqlx-mysql", "runtime-tokio-rustls"] }
serde = "1.0.229"
serde_json = "1.0.152"
sha2 = "0.10.9"
similar = "3.2.0"
socketioxide = "0.18.7"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = "0.7.1"
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["v4"] }
